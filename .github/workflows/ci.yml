
name: FleetCore CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fleetcore
          POSTGRES_USER: fleetcore
          POSTGRES_PASSWORD: fleetcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetcore -d fleetcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fleetcore
      SPRING_DATASOURCE_USERNAME: fleetcore
      SPRING_DATASOURCE_PASSWORD: fleetcore

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test
